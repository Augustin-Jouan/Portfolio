
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>

<body class="m-0 p-0 font-[Outfit] text-white text-2xl ">

    <header class = "fixed top-0 items-center">
        <nav class = "flex justify-left text-center my-2 items-center bg-[#8ddcdc] rounded-full">
            <a href = "#welcome" class = "m-2">Welcome</a>
            <a href = "#bio" class = "m-2">Bio</a>
            <a href = "#projects" class = "m-2">Projects</a>
        </nav>
    </header>
    <main>
        <section class = "flex flex-col h-screen w-20 justify-center items-center fixed right-0 rounded">
            
            <button id = "btn" class = "shadow-2xl flex flex-col h-1/3 w-2/3 bg-[#8ddcdc] items-center justify-center my-2 rounded-full whitespace-nowrap">
                <p class = "rotate-90 text-center">Contact Me !!</p>
            </button> 

            <button class = "shadow-2xl w-2/3 bg-[#8ddcdc] rounded-full flex flex-row h-2/3 items-center justify-center my-2"> 
                <p class = "rotate-90">Links...</p>
            </button>

        </section>

        <aside id = "form" class = "shadow-2xl flex flex-col h-4/5 w-4/5 justify-center items-center fixed right-20 top-1/2 -translate-y-1/2 translate-x-[calc(100%+5rem)] rounded bg-[#8ddcdc] transition-transform duration-500 ease-in-out">
            <p class = "text-5xl">FORM</p>
        </aside> 

        <section id = "welcome" class = "flex items-center justify-center h-screen  bg-[#f9e4b7] w-screen ">
            <p class = "text-5xl text-[#5b8065]"> Welcome </p>
        </section>

        <section id = "bio" class = "flex items-center justify-center h-screen bg-[#ff8b84] w-screen">
            <p class = "text-5xl text-[#f9e4b7]"> Bio </p>
        </section>

        <section id = "projects" class = "flex items-center justify-center h-screen bg-[#5b8065] w-screen">
            <p class = "text-5xl text-[#ff8b84]"> Projects </p>
        </section>
    </main>
    <footer class="bg-[#A58C77] fixed bottom-0">
        <p class = "text-center text-xs">© 2025 by Augustin JOUAN</p>
    </footer>
<script>
    const btn = document.getElementById("btn");
    const form = document.getElementById("form");
    btn.addEventListener("click", () => {
        form.classList.toggle('translate-x-[calc(100%+5rem)]');

    })
</script>

</body>
</html>
